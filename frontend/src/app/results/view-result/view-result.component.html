<div class="view-result-container">
  <h2>Student Results</h2>

  <div class="feedback error" *ngIf="loadError">❌ {{ loadError }}</div>

  <table class="results-table" *ngIf="results.length; else noResults">
    <thead>
      <tr>
        <th>Student</th>
        <th>Course</th>
        <th>Session</th>
        <th>Level</th>
        <th>Semester</th>
        <th>Score</th>
        <th>Grade</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let r of results">
        <td>{{ r.student?.name }}</td>
        <td>{{ r.course?.courseCode }} — {{ r.course?.courseName }}</td>
        <td>{{ r.session }}</td>
        <td>{{ r.level }}L</td>
        <td>{{ r.semester === 'first' ? 'First' : 'Second' }}</td>
        <td>{{ r.score }}</td>
        <td><span class="grade-badge">{{ r.grade }}</span></td>
        <td>
          <button class="delete-btn" (click)="deleteResult(r._id)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>

  <ng-template #noResults>
    <p class="empty-state">No results recorded yet.</p>
  </ng-template>
</div>
