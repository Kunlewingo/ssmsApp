<div class="add-result-container">
  <h2>Add Result</h2>

  <div class="form-group">
    <label>Student</label>
    <select [(ngModel)]="selectedStudentId" (ngModelChange)="onStudentChange()">
      <option [ngValue]="null">-- Select Student --</option>
      <option *ngFor="let s of students" [ngValue]="s._id">{{ s.name }} ({{ s.email }})</option>
    </select>
  </div>

  <div class="student-info" *ngIf="selectedStudent">
    <span class="badge">Level: {{ selectedStudent.level }}L</span>
    <span class="badge">Session: {{ selectedStudent.currentSession }}</span>
  </div>

  <div class="form-group" *ngIf="selectedStudent">
    <label>Semester</label>
    <div class="button-group">
      <button
        type="button"
        class="pill-btn"
        [class.active]="result.semester === 'first'"
        (click)="result.semester = 'first'; onSemesterChange()">
        First Semester
      </button>
      <button
        type="button"
        class="pill-btn"
        [class.active]="result.semester === 'second'"
        (click)="result.semester = 'second'; onSemesterChange()">
        Second Semester
      </button>
    </div>
  </div>

  <div class="form-group" *ngIf="courses.length">
    <label>Course</label>
    <select [(ngModel)]="result.course" (ngModelChange)="onCourseChange()">
      <option value="">-- Select Course --</option>
      <option *ngFor="let c of courses" [value]="c._id">
        {{ c.courseCode }} — {{ c.courseName }} ({{ c.units }} units)
      </option>
    </select>
  </div>

  <div class="form-group" *ngIf="result.course">
    <label>Score (0–100)</label>
    <input
      type="number"
      min="0"
      max="100"
      [(ngModel)]="result.score"
      (input)="calculateGradePreview()"
      placeholder="Enter score">
  </div>

  <div class="grade-preview" *ngIf="gradePreview">
    Grade: <span class="grade-badge">{{ gradePreview }}</span>
  </div>

  <button class="btn-primary" (click)="addResult()" [disabled]="!result.course">
    Submit Result
  </button>
</div>
