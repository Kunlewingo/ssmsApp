<div class="management-container">
  <h2>Manage Departments</h2>

  <div class="form-group">
    <label>Faculty</label>
    <select [(ngModel)]="selectedFacultyId" (ngModelChange)="onFacultyChange()">
      <option value="">-- Select Faculty --</option>
      <option *ngFor="let f of faculties" [value]="f._id">{{ f.name }}</option>
    </select>
  </div>

  <div *ngIf="selectedFacultyId">
    <div class="add-form-grid">
      <div class="form-group">
        <label>Department Name</label>
        <input type="text" [(ngModel)]="newDept.name" placeholder="e.g. Computer Engineering">
      </div>

      <div class="form-group">
        <label>Program Length</label>
        <div class="button-group">
          <button type="button" class="pill-btn" [class.active]="newDept.durationYears === 4"
            (click)="newDept.durationYears = 4">4 Years</button>
          <button type="button" class="pill-btn" [class.active]="newDept.durationYears === 5"
            (click)="newDept.durationYears = 5">5 Years</button>
        </div>
      </div>

      <div class="form-group">
        <label>Min Electives</label>
        <input type="number" min="1" max="5" [(ngModel)]="newDept.electiveMin">
      </div>

      <div class="form-group">
        <label>Max Electives</label>
        <input type="number" min="1" max="5" [(ngModel)]="newDept.electiveMax">
      </div>
    </div>

    <button class="btn-primary" [disabled]="submitting || !newDept.name.trim()" (click)="addDepartment()">
      {{ submitting ? 'Adding...' : 'Add Department' }}
    </button>

    <div class="feedback error" *ngIf="error">{{ error }}</div>

    <h3>Departments in this Faculty</h3>
    <div class="dept-grid">
      <div class="dept-card" *ngFor="let d of departments">
        <span class="dept-name">{{ d.name }}</span>
        <span class="dept-meta">{{ d.durationYears }}-year program</span>
        <span class="dept-meta">Electives: {{ d.electiveRules.min }}–{{ d.electiveRules.max }}</span>
      </div>
    </div>
    <p class="empty-state" *ngIf="!departments.length">No departments added yet for this faculty.</p>
  </div>
</div>
