<div class="dashboard-page">
  <header class="page-header">
    <h1>Dashboard</h1>
    <p class="page-subtitle">A quick look at what's happening across the school.</p>
  </header>

  <div class="feedback error" *ngIf="loadError">❌ {{ loadError }}</div>

  <div class="stats-grid">
    <div class="stat-card stat-blue">
      <span class="stat-icon">🎓</span>
      <div>
        <span class="stat-number">{{ totalStudents }}</span>
        <span class="stat-label">Students</span>
      </div>
    </div>
    <div class="stat-card stat-purple">
      <span class="stat-icon">📚</span>
      <div>
        <span class="stat-number">{{ totalCourses }}</span>
        <span class="stat-label">Courses</span>
      </div>
    </div>
    <div class="stat-card stat-green">
      <span class="stat-icon">📋</span>
      <div>
        <span class="stat-number">{{ totalRegistrations }}</span>
        <span class="stat-label">Registrations</span>
      </div>
    </div>
  </div>
</div>
