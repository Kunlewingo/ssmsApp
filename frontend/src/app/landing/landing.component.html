<div class="landing-container">
  <div class="landing-card">
    <h1>School Management System</h1>
    <p class="subtitle">Choose how you'd like to sign in</p>

    <div class="portal-buttons">
      <button class="portal-btn admin" (click)="goToAdminLogin()">
        <span class="icon">🛠️</span>
        <span class="label">Admin Login</span>
      </button>

      <button class="portal-btn student" (click)="goToStudentLogin()">
        <span class="icon">🎓</span>
        <span class="label">Student Login</span>
      </button>
    </div>
  </div>
</div>
