<div class="login-container">

  <div class="login-box">

    <h2>Set Your Password</h2>
    <p class="subtitle">You're using a temporary password. Set your own before continuing.</p>

    <input [(ngModel)]="currentPassword" type="password" placeholder="Temporary password" name="currentPassword">
    <input [(ngModel)]="newPassword" type="password" placeholder="New password" name="newPassword">
    <input [(ngModel)]="confirmPassword" type="password" placeholder="Confirm new password" name="confirmPassword">

    <button class="btn btn-primary" (click)="submit()" [disabled]="loading">
      {{ loading ? 'Saving...' : 'Set Password' }}
    </button>

    <p class="error">{{ error }}</p>

  </div>

</div>
