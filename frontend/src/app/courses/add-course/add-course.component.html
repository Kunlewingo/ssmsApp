<div class="add-course-container">
  <h2>Add Course</h2>

  <div class="form-group">
    <label>Faculty</label>
    <select [(ngModel)]="selectedFacultyId" (ngModelChange)="onFacultyChange()">
      <option value="">-- Select Faculty --</option>
      <option *ngFor="let f of faculties" [value]="f._id">{{ f.name }}</option>
    </select>
  </div>

  <div class="form-group" *ngIf="selectedFacultyId">
    <label>Department</label>
    <select [(ngModel)]="course.department">
      <option value="">-- Select Department --</option>
      <option *ngFor="let d of departments" [value]="d._id">{{ d.name }}</option>
    </select>
  </div>

  <div class="form-group">
    <label>Course Name</label>
    <input type="text" [(ngModel)]="course.courseName" placeholder="e.g. Introduction to Computer Science">
  </div>

  <div class="form-group">
    <label>Course Code</label>
    <input type="text" [(ngModel)]="course.courseCode" placeholder="e.g. CSC101">
  </div>

  <div class="form-group">
    <label>Description (optional)</label>
    <input type="text" [(ngModel)]="course.description" placeholder="Short description">
  </div>

  <div class="form-group">
    <label>Level</label>
    <div class="button-group">
      <button *ngFor="let lvl of levels" type="button" class="pill-btn"
        [class.active]="course.level === lvl" (click)="course.level = lvl">
        {{ lvl }}L
      </button>
    </div>
  </div>

  <div class="form-group">
    <label>Semester</label>
    <div class="button-group">
      <button type="button" class="pill-btn" [class.active]="course.semester === 'first'"
        (click)="course.semester = 'first'">First Semester</button>
      <button type="button" class="pill-btn" [class.active]="course.semester === 'second'"
        (click)="course.semester = 'second'">Second Semester</button>
    </div>
  </div>

  <div class="form-group">
    <label>Type</label>
    <div class="button-group">
      <button type="button" class="pill-btn" [class.active]="course.type === 'compulsory'"
        (click)="course.type = 'compulsory'">Compulsory</button>
      <button type="button" class="pill-btn" [class.active]="course.type === 'elective'"
        (click)="course.type = 'elective'">Elective</button>
    </div>
  </div>

  <div class="form-group">
    <label>Units</label>
    <input type="number" min="1" max="6" [(ngModel)]="course.units">
  </div>

  <button class="btn-primary" (click)="addCourse()">Add Course</button>
</div>
