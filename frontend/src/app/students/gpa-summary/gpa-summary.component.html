<div class="gpa-container">
  <h2>My GPA</h2>

  <div class="feedback error" *ngIf="loadError">❌ {{ loadError }}</div>

  <div class="form-group" *ngIf="currentStudent">
    <label>Semester</label>
    <div class="button-group">
      <button type="button" class="pill-btn" [class.active]="semester === 'first'"
        (click)="selectSemester('first')">First Semester</button>
      <button type="button" class="pill-btn" [class.active]="semester === 'second'"
        (click)="selectSemester('second')">Second Semester</button>
    </div>
  </div>

  <div class="gpa-cards">
    <div class="gpa-card">
      <span class="gpa-number">{{ semesterGPA ?? '—' }}</span>
      <span class="gpa-label">Semester GPA</span>
    </div>
    <div class="gpa-card">
      <span class="gpa-number">{{ sessionCGPA ?? '—' }}</span>
      <span class="gpa-label">Session CGPA</span>
    </div>
    <div class="gpa-card">
      <span class="gpa-number">{{ cumulativeCGPA ?? '—' }}</span>
      <span class="gpa-label">Cumulative CGPA</span>
    </div>
  </div>
</div>
