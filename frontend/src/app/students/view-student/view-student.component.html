<div class="view-student-container">
  <div class="header-row">
    <h2>Students</h2>
    <div class="header-actions">
      <input
        type="text"
        class="search-input"
        [(ngModel)]="searchTerm"
        placeholder="Search by name, email, or department...">
      <a routerLink="/add-student" class="btn-primary add-link">+ Add Student</a>
    </div>
  </div>

  <div class="feedback error" *ngIf="loadError">❌ {{ loadError }}</div>

  <div class="student-grid" *ngIf="filteredStudents.length; else noStudents">
    <a
      class="student-card"
      *ngFor="let s of filteredStudents"
      [routerLink]="['/admin/students', s._id]">

      <div class="avatar">{{ initials(s.name) }}</div>

      <div class="student-details">
        <span class="student-name">{{ s.name }}</span>
        <span class="student-email">{{ s.email }}</span>
        <div class="student-tags">
          <span class="tag">{{ s.department?.name }}</span>
          <span class="tag">{{ s.level }}L</span>
        </div>
      </div>

      <button class="delete-btn" (click)="deleteStudent(s._id, $event)">Delete</button>
    </a>
  </div>

  <ng-template #noStudents>
    <p class="empty-state">No students found.</p>
  </ng-template>
</div>
